name: Build PWA Zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install || true
      - name: Copy dist
        run: node copy-dist.mjs || true
      - name: Package ZIP
        run: |
          zip -r zjh-pwa.zip . \
            -x 'node_modules/*' '.git/*' '.github/*' 'scripts/*' \
            -x '*.zip' '*.log'
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: zjh-pwa.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
