name: Build PWA Zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (若你项目有 npm run build 才需要；没有可注释)
        run: npm run build

      - name: Create zip
        run: |
          # 方案A：把当前项目（排除.git/.github/node_modules）打成 zip
          zip -r zjh-pwa.zip . -x ".git/*" ".github/*" "node_modules/*"
          # 方案B：如果你的产物在 dist/，改用：
          # cd dist && zip -r ../zjh-pwa.zip ./*

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: zjh-pwa.zip
          generate_release_notes: true
